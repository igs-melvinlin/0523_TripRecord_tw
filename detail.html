<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>景點詳細 · TripBook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="assets/js/data.js"></script>
  <script type="text/babel" src="assets/js/components.jsx"></script>
  <script type="text/babel">
    const { useMemo, useEffect } = React;

    function DetailApp() {
      const trip = useMemo(() => {
        let base = window.DEFAULT_TRIP;
        try {
          const raw = localStorage.getItem("tripbook.trip");
          if (raw) base = JSON.parse(raw);
        } catch (e) {}
        const days = window.buildDays(base);
        return { ...base, days };
      }, []);
      const theme = localStorage.getItem("tripbook.theme") || "sunrise";
      const mode  = localStorage.getItem("tripbook.mode")  || "light";
      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-mode", mode);
      }, [theme, mode]);

      const params = new URLSearchParams(location.search);
      const id = params.get("id") || trip.spots[0]?.id;
      const spot = trip.spots.find(s => s.id === id) || trip.spots[0];
      const idx = trip.spots.findIndex(s => s.id === spot.id);
      const prev = idx > 0 ? trip.spots[idx - 1] : null;
      const next = idx < trip.spots.length - 1 ? trip.spots[idx + 1] : null;
      const day  = trip.days.find(d => d.date === spot.date) || trip.days[0];

      return (
        <div className="standalone">
          <a className="standalone-back" href="share.html">← 回到行程總覽</a>

          <div className="detail-hero">
            <PhotoPlaceholder hint={spot.photo || "scenic spot photo"} />
          </div>

          <div className="detail-grid">
            <div>
              <div style={{marginBottom: 14, display:"flex", gap:10, alignItems:"center"}}>
                <CategoryChip category={spot.category} />
                <span style={{color:"var(--muted)", fontSize:12, letterSpacing:".06em", textTransform:"uppercase"}} className="mono">
                  {day?.label} · {spot.time}
                </span>
              </div>
              <h1>{spot.title}</h1>
              <div style={{color:"var(--muted)", fontSize:14, marginBottom:24, display:"flex", alignItems:"center", gap:6}}>
                <I.pin cls="icon-sm" /> {spot.address}
              </div>

              <div className="section-title" style={{marginTop:24}}><span>行程筆記</span></div>
              <div className="notes" style={{marginBottom: 28}}>{spot.notes || "暫無筆記。"}</div>

              <div className="section-title"><span>交通方式</span></div>
              <div className="notes" style={{marginBottom: 28}}>
                從前一站到此地：<strong>{spot.transport || "—"}</strong>
                {prev && <div style={{marginTop:10, color:"var(--muted)", fontSize:13}}>上一站：{prev.title}（{prev.time}）</div>}
                {next && <div style={{marginTop:6, color:"var(--muted)", fontSize:13}}>下一站：{next.title}（{next.time}）</div>}
              </div>

              {spot.mapUrl && (
                <React.Fragment>
                  <div className="section-title"><span>位置</span></div>
                  <div className="gmap-wrap" style={{aspectRatio:"16/9", borderRadius:14, border:"1px solid var(--line)", marginBottom: 36}}>
                    <iframe
                      className="gmap-frame"
                      src={spot.mapUrl}
                      title="景點地圖"
                      loading="lazy"
                      referrerPolicy="no-referrer-when-downgrade"
                      allowFullScreen
                    />
                    <a className="gmap-open" target="_blank" rel="noreferrer" href={spot.mapUrl}>
                      <I.external cls="icon-sm" /> 在 Google Maps 開啟
                    </a>
                  </div>
                </React.Fragment>
              )}

              <div style={{display:"flex", justifyContent:"space-between", paddingTop:24, borderTop:"1px solid var(--line)"}}>
                {prev ? <a href={`detail.html?id=${prev.id}`} style={{color:"var(--ink-2)", fontSize:13}}>← {prev.title}</a> : <span />}
                {next ? <a href={`detail.html?id=${next.id}`} style={{color:"var(--ink-2)", fontSize:13, textAlign:"right"}}>{next.title} →</a> : <span />}
              </div>
            </div>

            <aside className="detail-side">
              <div className="row"><span className="k">時間</span><span className="v">{spot.time}</span></div>
              <div className="row"><span className="k">停留</span><span className="v">{fmtDur(spot.duration)}</span></div>
              <div className="row"><span className="k">花費</span><span className="v">{fmtCost(spot.cost)}</span></div>
              <div className="row"><span className="k">交通</span><span className="v" style={{fontFamily:"var(--font-sans)"}}>{spot.transport || "—"}</span></div>
              <div className="row" style={{flexDirection:"column", alignItems:"stretch", gap:8}}>
                {spot.mapUrl && (
                  <a className="ctl" target="_blank" rel="noreferrer" href={spot.mapUrl} style={{justifyContent:"center"}}>
                    <I.external cls="icon-sm" /> 在 Google Maps 開啟
                  </a>
                )}
                <a className="ctl primary" href="index.html" style={{justifyContent:"center"}}>編輯行程</a>
              </div>
            </aside>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<DetailApp />);
  </script>
</body>
</html>
